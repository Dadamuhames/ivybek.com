name: Deploy IvyBek Landing

on:
  push:
    branches:
      - master
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set deployment directory
        run: |
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "DEPLOY_DIR=/var/www/ivybek/ivybek.com/prod/dist" >> $GITHUB_ENV
          else
            echo "DEPLOY_DIR=/var/www/ivybek/ivybek.com/dev/dist" >> $GITHUB_ENV
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: .output/public/
          remote_path: ${{ env.DEPLOY_DIR }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: 2222
